services:
  db:
    image: postgres:18
    container_name: shop-app-platform-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_app_platform}
      POSTGRES_USER: ${POSTGRES_USER:-shop_app_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_app_secret_password_2026}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop_app_platform} -d ${POSTGRES_DB:-shop_app_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shop-app-platform-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shop_app_platform}:${POSTGRES_PASSWORD:-shop_app_secret_password_2026}@db:5432/${POSTGRES_DB:-shop_app_platform}
      SECRET_KEY: ${SECRET_KEY}

    ports:
      - "8000:8000"

volumes:
  postgres_data: